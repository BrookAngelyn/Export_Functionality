<template>
    <lightning-card title="Export Dashboard Data" icon-name="standard:report">
        <div class="slds-p-horizontal_medium">
            <lightning-combobox
                label="Select Component to Export"
                value={selectedComponent}
                options={componentOptions}
                onchange={handleComponentChange}
                class="slds-m-bottom_medium">
            </lightning-combobox>
            
            <lightning-button 
                label="Export to CSV" 
                variant="brand" 
                onclick={handleExportClick}
                disabled={isLoading}
                class="slds-m-bottom_medium">
            </lightning-button>
            
            <template if:true={isLoading}>
                <div class="slds-p-vertical_medium">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    <div class="slds-text-color_weak slds-text-align_center">Processing export...</div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
